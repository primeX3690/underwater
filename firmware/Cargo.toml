


[package]
name = "underwater_mesh_firmware"
version = "1.0.0"
edition = "2021"
authors = ["Raghavendra Pratap Singh <Autonomous Defense Systems>"]

[dependencies]
# नो-स्टैंडर्ड (no_std) एम्बेड्ड एनवायरनमेंट के लिए कोर क्रेट्स
cfg-if = "1.0"
heapless = "0.7.16" # डायनेमिक मेमोरी एलोकेशन से बचने के लिए (एम्बेड्ड सेफ्टी)
crypto-box = { version = "0.9.1", features = ["std"] } # AES / ChaCha20 एन्क्रिप्शन के लिए
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"